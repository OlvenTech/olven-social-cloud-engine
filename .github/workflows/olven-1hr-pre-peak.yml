name: Olven Tech — 1-Hour-Before-Peak Live Cloud Generator & Anti-Slop Gate

on:
  schedule:
    # Wave 1 (Morning, Daily Mon-Sun): 06:47 UTC = 11:47 AM PKT (~1h13m before 01:00 PM PKT / 08:00 UTC Morning Peak; avoids :00 cron lag)
    - cron: '47 6 * * *'
    # Wave 2 (Evening, Fri): 12:47 UTC = 05:47 PM PKT (~1h13m before 07:00 PM PKT / 14:00 UTC Fri Peak)
    - cron: '47 12 * * 5'
    # Wave 2 (Evening, Wed & Sat): 13:47 UTC = 06:47 PM PKT (~1h13m before 08:00 PM PKT / 15:00 UTC Wed/Sat Peak)
    - cron: '47 13 * * 3,6'
    # Wave 2 (Evening, Tue & Thu): 14:47 UTC = 07:47 PM PKT (~1h13m before 09:00 PM PKT / 16:00 UTC Tue/Thu Peak)
    - cron: '47 14 * * 2,4'
    # Wave 2 (Evening, Sun & Mon): 15:47 UTC = 08:47 PM PKT (~1h13m before 10:00 PM PKT / 17:00 UTC Sun/Mon Peak)
    - cron: '47 15 * * 0,1'

  workflow_dispatch:
    inputs:
      day_num:
        description: 'Target Day Number (leave empty for auto-next from state/wave_cursor.json)'
        required: false
        default: ''
      slot:
        description: 'Morning or Evening (leave empty for auto-next from state/wave_cursor.json)'
        required: false
        default: ''
      media_type:
        description: 'video or image (leave empty to auto-alternate from state/wave_cursor.json)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate-lint-stage-1hr-before:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Olven Social Cloud Engine
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Pillow, Node deps & FFmpeg (uses preinstalled Chrome)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            DEBIAN_FRONTEND=noninteractive sudo apt-get update -qq
            DEBIAN_FRONTEND=noninteractive sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          pip install --quiet pillow requests
          npm install --no-audit --no-fund
          if [ ! -x /usr/bin/google-chrome ] && [ ! -x /usr/bin/chromium ]; then
            npx playwright install --with-deps chromium
          fi

      - name: Execute Live R&D, 6-Archetype Visual/Reel Render & 3-Layer Anti-Slop Quality Blocker
        run: |
          python3 run_cloud_wave.py "${{ github.event.inputs.day_num }}" "${{ github.event.inputs.slot }}" "${{ github.event.inputs.media_type }}"

      - name: Commit verified wave to live_out/ and advance cursor
        id: commit_wave
        run: |
          git config user.name "olven-cloud-engine"
          git config user.email "contact@olventech.com"
          git add state/wave_cursor.json live_out/ history/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No wave changes staged (cooldown skip) — skipping push and Make trigger."
          else
            git commit -m "chore(wave): render & verify live T-1h wave"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge jsDelivr CDN & Trigger Make.com Scenario 8619522 to stage QUEUED row
        if: steps.commit_wave.outputs.changed == 'true'
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
        run: |
          for f in manifest.json linkedin.png facebook.png instagram.png x.png walkthrough-video.mp4; do
            curl -fsSL "https://purge.jsdelivr.net/gh/OlvenTech/olven-social-cloud-engine@main/live_out/${f}" || true
          done
          sleep 5
          curl -fsSL -X POST "https://eu1.make.com/api/v2/scenarios/8619522/run" \
            -H "Authorization: Token ${MAKE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo ""
          echo "Triggered Make.com Scenario 8619522 to stage QUEUED row."
