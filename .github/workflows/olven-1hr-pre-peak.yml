name: Olven Tech — 1-Hour-Before-Peak Live Cloud Generator & Anti-Slop Gate

on:
  schedule:
    # Wave 1 (Morning, Daily Mon-Sun): 07:00 UTC = 12:00 PM PKT (1 hour before 01:00 PM PKT / 08:00 UTC Morning Peak)
    - cron: '0 7 * * *'
    # Wave 2 (Evening, Fri): 13:00 UTC = 06:00 PM PKT (1 hour before 07:00 PM PKT / 14:00 UTC Fri Peak)
    - cron: '0 13 * * 5'
    # Wave 2 (Evening, Wed & Sat): 14:00 UTC = 07:00 PM PKT (1 hour before 08:00 PM PKT / 15:00 UTC Wed/Sat Peak)
    - cron: '0 14 * * 3,6'
    # Wave 2 (Evening, Tue & Thu): 15:00 UTC = 08:00 PM PKT (1 hour before 09:00 PM PKT / 16:00 UTC Tue/Thu Peak)
    - cron: '0 15 * * 2,4'
    # Wave 2 (Evening, Sun & Mon): 16:00 UTC = 09:00 PM PKT (1 hour before 10:00 PM PKT / 17:00 UTC Sun/Mon Peak)
    - cron: '0 16 * * 0,1'

  workflow_dispatch:
    inputs:
      day_num:
        description: 'Target Day Number (leave empty for auto-next from state/wave_cursor.json)'
        required: false
        default: ''
      slot:
        description: 'Morning or Evening (leave empty for auto-next from state/wave_cursor.json)'
        required: false
        default: ''
      media_type:
        description: 'video or image (leave empty to auto-alternate from state/wave_cursor.json)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate-lint-stage-1hr-before:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Olven Social Cloud Engine
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium, Pillow & FFmpeg
        run: |
          command -v ffmpeg >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          pip install pillow requests
          npm install
          npx playwright install --with-deps chromium

      - name: Execute Live R&D, 6-Archetype Visual/Reel Render & 3-Layer Anti-Slop Quality Blocker
        run: |
          python3 run_cloud_wave.py "${{ github.event.inputs.day_num }}" "${{ github.event.inputs.slot }}" "${{ github.event.inputs.media_type }}"

      - name: Commit verified wave to live_out/ and advance cursor
        run: |
          git config user.name "olven-cloud-engine"
          git config user.email "contact@olventech.com"
          git add state/wave_cursor.json live_out/ history/
          git diff --staged --quiet || git commit -m "chore(wave): render & verify live T-1h wave"
          git push origin main

      - name: Purge jsDelivr CDN & Trigger Make.com Scenario 8619522 to stage QUEUED row
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
        run: |
          for f in manifest.json linkedin.png facebook.png instagram.png x.png walkthrough-video.mp4; do
            curl -fsSL "https://purge.jsdelivr.net/gh/OlvenTech/olven-social-cloud-engine@main/live_out/${f}" || true
          done
          sleep 5
          curl -fsSL -X POST "https://eu1.make.com/api/v2/scenarios/8619522/run" \
            -H "Authorization: Token ${MAKE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo ""
          echo "Triggered Make.com Scenario 8619522 to stage QUEUED row."
