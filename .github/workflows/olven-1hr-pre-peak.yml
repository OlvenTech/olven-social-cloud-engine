name: Olven Tech — 1-Hour-Before-Peak Live Cloud Generator & Anti-Slop Gate

# NOTE: Triggered deterministically at T-45 min (PKT) by Make.com Scenario 8619522 via workflow_dispatch
# (eliminates GitHub Actions free-tier schedule cron delays/drops).
on:
  workflow_dispatch:
    inputs:
      day_num:
        description: 'Target Day Number (leave empty for auto-next from state/wave_cursor.json)'
        required: false
        default: ''
      slot:
        description: 'Morning or Evening (leave empty for auto-next from state/wave_cursor.json)'
        required: false
        default: ''
      media_type:
        description: 'video or image (leave empty to auto-alternate from state/wave_cursor.json)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: olven-wave-generator
  cancel-in-progress: false

jobs:
  generate-lint-stage-1hr-before:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Olven Social Cloud Engine
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache pip & node_modules for fast deterministic CI runs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            node_modules
          key: olven-ci-deps-${{ runner.os }}-${{ hashFiles('package.json') }}-v2

      - name: Install Pillow, Node deps & FFmpeg (uses preinstalled Chrome)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            DEBIAN_FRONTEND=noninteractive sudo apt-get update -qq
            DEBIAN_FRONTEND=noninteractive sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          pip install --quiet pillow requests
          if [ ! -d node_modules/playwright ]; then
            npm install --no-audit --no-fund
          fi
          if [ ! -x /usr/bin/google-chrome ] && [ ! -x /usr/bin/chromium ]; then
            npx playwright install --with-deps chromium
          fi

      - name: Cache ArtCraft Creative Suite (EffectCraft v0.24.1 + PhotoCraft v0.23.1 + LightCraft v0.21.1)
        uses: actions/cache@v4
        with:
          path: ~/.local/artcraft
          key: artcraft-suite-ec0241-pc0231-lc0211-${{ runner.os }}-x86_64-v1

      - name: Install ArtCraft EffectCraft, PhotoCraft & LightCraft CLI binaries (if not cached)
        run: |
          EC_BIN="$HOME/.local/artcraft/effectcraft/effectcraft-0.24.1-linux-x86_64/bin/effectcraft-cli"
          PC_BIN="$HOME/.local/artcraft/photocraft/photocraft-0.23.1-linux-x86_64/bin/photocraft-cli"
          LC_BIN="$HOME/.local/artcraft/lightcraft/lightcraft-0.21.1-linux-x86_64/bin/lightcraft-cli"
          if [ ! -x "$EC_BIN" ]; then
            mkdir -p "$HOME/.local/artcraft/effectcraft"
            curl -fsSL "https://github.com/storytold/effectcraft/releases/download/v0.24.1/effectcraft-0.24.1-linux-x86_64.tar.gz" \
              | tar -xz -C "$HOME/.local/artcraft/effectcraft"
          fi
          if [ ! -x "$PC_BIN" ]; then
            mkdir -p "$HOME/.local/artcraft/photocraft"
            curl -fsSL "https://github.com/storytold/photocraft/releases/download/v0.23.1/photocraft-0.23.1-linux-x86_64.tar.gz" \
              | tar -xz -C "$HOME/.local/artcraft/photocraft"
          fi
          if [ ! -x "$LC_BIN" ]; then
            mkdir -p "$HOME/.local/artcraft/lightcraft"
            curl -fsSL "https://github.com/storytold/lightcraft/releases/download/v0.21.1/lightcraft-0.21.1-linux-x86_64.tar.gz" \
              | tar -xz -C "$HOME/.local/artcraft/lightcraft"
          fi
          echo "EFFECTCRAFT_CLI=$EC_BIN" >> "$GITHUB_ENV"
          echo "PHOTOCRAFT_CLI=$PC_BIN" >> "$GITHUB_ENV"
          echo "LIGHTCRAFT_CLI=$LC_BIN" >> "$GITHUB_ENV"
          "$EC_BIN" --version || true
          "$PC_BIN" --version || true
          "$LC_BIN" --version || true

      - name: Execute Live R&D, Multi-Tool ArtCraft Suite Render & 3-Layer Anti-Slop Quality Blocker
        run: |
          python3 run_cloud_wave.py "${{ github.event.inputs.day_num }}" "${{ github.event.inputs.slot }}" "${{ github.event.inputs.media_type }}"

      - name: Commit verified wave to live_out/ and advance cursor
        id: commit_wave
        run: |
          git config user.name "olven-cloud-engine"
          git config user.email "contact@olventech.com"
          git add state/wave_cursor.json live_out/ history/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No wave changes staged — skipping push."
          else
            git commit -m "chore(wave): render & verify live T-45m wave"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge jsDelivr CDN cache for freshly pushed media
        if: steps.commit_wave.outputs.changed == 'true'
        run: |
          for f in manifest.json linkedin.png facebook.png instagram.png x.png walkthrough-video.mp4; do
            curl -fsSL "https://purge.jsdelivr.net/gh/OlvenTech/olven-social-cloud-engine@main/live_out/${f}" || true
          done
          echo "CDN purged; Make Scenario 8619522 will fetch fresh manifest from GitHub API and stage QUEUED row."
